<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador QR (L - Mask 7)</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:#0f1115;color:#e8eaed}
  .card{background:#171a21;border:1px solid #262b36;border-radius:16px;
    padding:24px;max-width:520px;width:100%;text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,.35)}
  h1{font-size:18px;margin:0 0 14px;font-weight:600;letter-spacing:.3px}
  #msg{font-size:13px;color:#9aa4b2;margin-bottom:16px;min-height:18px}
  canvas{display:block;margin:0 auto;width:100%;max-width:320px;height:auto;
    background:#fff;padding:8px;border-radius:10px;image-rendering:pixelated}
  .btn{display:inline-block;margin-top:16px;background:#3b82f6;color:#fff;border:0;
    padding:12px 24px;border-radius:10px;font-size:15px;font-weight:600;
    cursor:pointer;text-decoration:none;width:100%;transition:background 0.2s}
  .btn:hover{background:#2563eb}
  .btn:active{transform:translateY(1px)}
  form{margin-top:18px;display:flex;gap:8px}
  input{flex:1;min-width:0;background:#0f1115;border:1px solid #2b313d;color:#e8eaed;
    padding:11px 12px;border-radius:10px;font-size:14px}
  input:focus{outline:2px solid #3b82f6;outline-offset:-1px}
  button[type=submit]{background:#262b36;color:#fff;border:0;padding:0 16px;
    border-radius:10px;font-weight:600;cursor:pointer;font-size:14px}
  button[type=submit]:hover{background:#3b82f6}
</style>
</head>
<body>
<div class="card">
  <h1>Generador QR Exacto</h1>
  <div id="msg">Cargando…</div>
  <canvas id="qr" hidden></canvas>
  <a id="dl" class="btn" hidden download="qr.png">Descargar PNG</a>
  <form id="form" hidden>
    <input id="txt" placeholder="Escribí el texto…" autocomplete="off">
    <button type="submit">Generar</button>
  </form>
</div>
  <script src="./js/LP7.js"></script>
</body>
</html>
